services:
  postgres:
    container_name: runs-app-postgres
    image: postgres:18.1
    environment:
      POSTGRES_DB: runsapp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: P4ssword!
    ports:
      - "5443:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
