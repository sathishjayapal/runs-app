# .github/workflows/ci-cd.yml
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar needs full git history for new-code/blame analysis

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Runs unit tests (Surefire) + integration tests (Failsafe), and the frontend
      # build/tests via frontend-maven-plugin, producing JaCoCo coverage as a byproduct
      - name: Run tests with coverage
        run: mvn verify -B

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/

  sonar:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: SonarCloud scan with Quality Gate
        env:
          SONAR_TOKEN: ${{ SONAR_TOKEN }}
        run: |
          mvn verify sonar:sonar \
            -Dsonar.projectKey=runs-app \
            -Dsonar.organization=dotsky \
            -Dsonar.qualitygate.wait=true