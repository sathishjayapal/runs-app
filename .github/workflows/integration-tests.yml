name: Integration Tests

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - '.github/workflows/integration-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - '.github/workflows/integration-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
  workflow_dispatch:
    inputs:
      docker_host:
        description: 'Remote Docker host (e.g., tcp://host:2376). Leave empty for local Docker.'
        required: false
        default: ''
      skip_integration_tests:
        description: 'Skip integration tests (use when Docker is unavailable)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # No services needed - TestContainers will manage PostgreSQL

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run integration tests
        if: github.event.inputs.skip_integration_tests != 'true'
        run: ./mvnw -B test -Pci
        env:
          # TestContainers will automatically use Docker available in GitHub Actions
          # Or connect to remote Docker if DOCKER_HOST is set
          DOCKER_HOST: ${{ github.event.inputs.docker_host }}
          TESTCONTAINERS_RYUK_DISABLED: false

      - name: Generate test report
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if compgen -G "target/surefire-reports/TEST-*.xml" > /dev/null; then
            echo "Test execution completed. Check artifacts for detailed results." >> $GITHUB_STEP_SUMMARY
          else
            echo "No test results found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/test-classes/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: target/site/jacoco/
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Maven Tests
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Comment test results on PR
        if: github.event_name == 'pull_request' && always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            target/surefire-reports/TEST-*.xml
          check_name: Test Results
          comment_title: Integration Test Results
          fail_on: nothing

  test-summary:
    name: Test Summary
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results
        continue-on-error: true

      - name: Generate summary
        run: |
          echo "# 🧪 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Classes" >> $GITHUB_STEP_SUMMARY
          echo "- GarminRunResourceTest (integration tests for Garmin run operations)" >> $GITHUB_STEP_SUMMARY
          echo "- StravaRunResourceTest (integration tests for Strava run operations)" >> $GITHUB_STEP_SUMMARY
          echo "- SecurityIntegrationTest (authentication and authorization tests)" >> $GITHUB_STEP_SUMMARY
          echo "- RunAppUserResourceTest (user management integration tests)" >> $GITHUB_STEP_SUMMARY
          echo "- ReferentialIntegrityTest (database referential integrity tests)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: TestContainers PostgreSQL is used for all integration tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ TestContainers working properly in CI/CD environment!" >> $GITHUB_STEP_SUMMARY
