# Runs App Development Database
# Includes: runs data + ShedLock for distributed scheduling
# Start with: docker-compose -f docker-compose.dev.yml up -d
# (Separate from production docker-compose.yml)

version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: runsapp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: runsapp_db
    ports:
      - "5433:5432"  # Note: Different port from eventstracker to allow parallel dev
    volumes:
      - runsapp_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - runsapp-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: runsapp-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"  # Different port from eventstracker pgadmin
    depends_on:
      - postgres
    networks:
      - runsapp-network
    profiles:
      - pgadmin

volumes:
  runsapp_data:
    driver: local

networks:
  runsapp-network:
    driver: bridge
