# Deploy as a new stack on the mac13 environment in Portainer (Stacks -> Add stack, environment: mac13).
# Mirrors the cAdvisor already running on runs-server (same image, mounts, privileged). Published on :9099 so
# Prometheus on runs-server can scrape it over the LAN. cAdvisor has no auth: keep the port LAN-only.
services:
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.5
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "9099:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
