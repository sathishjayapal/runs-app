spring:
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${JDBC_DATABASE_USERNAME}
    password: ${JDBC_DATABASE_PASSWORD}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    port: 587
    properties.mail.smtp:
      auth: true
      starttls:
        enable: true
        required: true
      connectiontimeout: 15000
      timeout: 45000
  docker:
    compose:
      enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
logging:
  level:
    org.springframework.amqp: DEBUG
    org.springframework.amqp.rabbit: DEBUG
    me.sathish.runs_app.config.RabbitMQConfiguration: DEBUG
    me.sathish.runs_app.garmin_fit_import: DEBUG
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    http-statuses:
      org.springframework.security.authorization.AuthorizationDeniedException: unauthorized
    codes:
      RunnerAppRoleRoleNameUnique: RUNNER_APP_ROLE_ROLE_NAME_UNIQUE
management:
  endpoints:
    web:
      exposure:
        include: health,loggers,integrationgraph,shutdown
  endpoint:
    health:
      show-details: always
    shutdown:
      access: unrestricted
springdoc:
  pathsToMatch: /api/**
runs-ai-analyzer:
  base-url: ${RUNS_AI_ANALYZER_URL}

app:
  baseHost: ${BASE_HOST}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:9080,http://127.0.0.1:9080}
  mail:
    from: ${MAIL_FROM:noreply@example.com}
    displayName: ${MAIL_DISPLAY_NAME:Runs App}
  garmin:
    csv-import-enabled: ${GARMIN_CSV_IMPORT_ENABLED:true}
    csv-import-user-id: ${GARMIN_SYSTEM_USER_ID}
    csv-import-schedule: ${GARMIN_CSV_IMPORT_SCHEDULE}
    import:
      source: ${GARMIN_IMPORT_SOURCE:DRIVE}
      drive:
        folder-id: ${GARMIN_DRIVE_FOLDER_ID:}
        processed-folder-id: ${GARMIN_DRIVE_PROCESSED_FOLDER_ID:}
        quarantine-folder-id: ${GARMIN_DRIVE_QUARANTINE_FOLDER_ID:}
        failed-folder-id: ${GARMIN_DRIVE_FAILED_FOLDER_ID:}
        retry-folder-id: ${GARMIN_DRIVE_RETRY_FOLDER_ID:}
        service-account-key-path: ${GARMIN_DRIVE_SERVICE_ACCOUNT_KEY_PATH:}
        service-account-key-base64: ${GARMIN_DRIVE_SERVICE_ACCOUNT_KEY_BASE64:}
        application-name: ${GARMIN_DRIVE_APPLICATION_NAME:Runs App CSV Importer}
      systemUserId: ${GARMIN_SYSTEM_USER_ID}
      alert:
        email:
          enabled: ${GARMIN_ALERT_EMAIL_ENABLED:true}
          max-failures-before-alert: ${GARMIN_ALERT_EMAIL_MAX_RETRY_ATTEMPTS:3}
          recipients: ${GARMIN_ALERT_EMAIL_RECIPIENTS:}
          from-address: ${GARMIN_ALERT_EMAIL_FROM:garmin-import@example.com}
