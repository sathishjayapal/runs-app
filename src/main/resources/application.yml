spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5443/runsapp_db}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    port: 587
    properties.mail.smtp:
      auth: true
      starttls:
        enable: true
        required: true
      connectiontimeout: 15000
      timeout: 45000
  docker:
    compose:
      enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
logging:
  level:
    org.springframework.amqp: DEBUG
    org.springframework.amqp.rabbit: DEBUG
    me.sathish.runs_app.config.RabbitMQConfiguration: DEBUG
    me.sathish.runs_app.garmin_fit_import: DEBUG
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    http-statuses:
      org.springframework.security.authorization.AuthorizationDeniedException: unauthorized
    codes:
      RunnerAppRoleRoleNameUnique: RUNNER_APP_ROLE_ROLE_NAME_UNIQUE
management:
  endpoints:
    web:
      exposure:
        include: health,loggers,integrationgraph,shutdown
  endpoint:
    health:
      show-details: always
    shutdown:
      access: unrestricted
springdoc:
  pathsToMatch: /api/**
app:
  baseHost: ${BASE_HOST:http://localhost:3000}
  mail:
    from: sathishk.dot@gmail.com
    displayName: Sathish Jayapal
  garmin:
    import:
      folder: ${GARMIN_IMPORT_FOLDER:/data/garmin-fit-files}
      csv-folder: ${GARMIN_CSV_FOLDER:/data/garmin-csv-files}
      systemUserId: ${GARMIN_SYSTEM_USER_ID:10000}
